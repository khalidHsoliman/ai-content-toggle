<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AI Content Toggle</title>
<style>
  :root {
    color-scheme: light dark;
    --surface: #ffffff;
    --text: #1d1d1d;
    --muted: #666666;
    --track: #c4c4c4;
    --accent: #0a66c2;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --surface: #1b1f23;
      --text: #e8e8e8;
      --muted: #a3a3a3;
      --track: #575b5f;
      --accent: #71b7fb;
    }
  }
  body {
    margin: 0;
    width: 260px;
    padding: 14px 16px 6px;
    background: var(--surface);
    color: var(--text);
    font: 13px/1.4 system-ui, sans-serif;
  }
  h1 { margin: 0 0 4px; font-size: 14px; font-weight: 600; }
  label { display: flex; align-items: center; gap: 12px; padding: 10px 0; cursor: pointer; }
  label + label { border-top: 1px solid color-mix(in srgb, var(--muted) 25%, transparent); }
  .text { flex: 1; }
  .name { display: block; font-weight: 500; }
  .hint { display: block; color: var(--muted); font-size: 12px; }
  input {
    appearance: none;
    position: relative;
    flex: none;
    width: 34px;
    height: 20px;
    margin: 0;
    border-radius: 10px;
    background: var(--track);
    cursor: pointer;
    transition: background 0.15s;
  }
  input::before {
    content: "";
    position: absolute;
    top: 2px;
    left: 2px;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: #ffffff;
    transition: transform 0.15s;
  }
  input:checked { background: var(--accent); }
  input:checked::before { transform: translateX(14px); }
  input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) {
    input, input::before { transition: none; }
  }
</style>
</head>
<body>
  <h1>AI Content Toggle</h1>
  <label>
    <span class="text">
      <span class="name">Hide AI posts</span>
      <span class="hint">Posts the on-device models flag as likely AI</span>
    </span>
    <input type="checkbox" role="switch" id="hideAI">
  </label>
  <label>
    <span class="text">
      <span class="name">Hide ads</span>
      <span class="hint">Promoted posts, sidebar ads and Premium upsells</span>
    </span>
    <input type="checkbox" role="switch" id="hideAds">
  </label>
  <script src="popup.js"></script>
</body>
</html>
